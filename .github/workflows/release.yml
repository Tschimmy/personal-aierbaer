name: release

# Build the macOS app and publish a GitHub Release whenever a version tag is
# pushed (created by `make deploy V=x.y.z`). Company members download the .dmg
# from the repo's Releases page.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Personal Aierbaer ${{ github.ref_name }}"
          releaseBody: "Download the .dmg below. See CHANGELOG.md for release notes."
          releaseDraft: false
          prerelease: false
